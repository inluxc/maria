<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12.º Aniversário da Maria - Confirmação de presença</title>
    <style>
        :root {
            --base-red: #b51639;
            --base-red-dark: #6e0b22;
            --base-red-soft: #f1c2cd;
            --panel-dark: #170910;
            --panel-dark-2: #2b0f1a;
            --text-soft: #f3dfe7;
            --shadow-red: rgba(181, 22, 57, 0.34);
        }

        body {
            background: radial-gradient(ellipse at top, #2d0d16 0%, #10080c 58%);
            color: #ffffff;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            isolation: isolate;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 18px 24px, rgba(255, 201, 117, 0.8) 0 1px, transparent 1.8px),
                radial-gradient(circle at 82px 115px, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.8px),
                radial-gradient(circle at 154px 62px, rgba(150, 38, 66, 0.8) 0 1px, transparent 1.8px),
                radial-gradient(circle at 208px 176px, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.8px);
            background-size: 240px 220px, 310px 280px, 370px 330px, 280px 240px;
            opacity: 0.7;
            animation: star-drift 8s ease-in-out infinite alternate, star-twinkle 4s ease-in-out infinite alternate;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--panel-dark-2), var(--panel-dark));
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px var(--shadow-red);
            border: 2px solid var(--base-red);
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            animation: card-arrive 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }
        h2 {
            color: var(--base-red);
            margin-bottom: 10px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            letter-spacing: 0.06em;
            font-size: clamp(1.9rem, 3.2vw, 2.6rem);
            line-height: 1.2;
        }
        p { color: var(--text-soft); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
        .music-player {
            width: min(100%, 300px);
            margin: 22px auto;
            overflow: hidden;
            border: 1px solid rgba(195, 72, 98, 0.72);
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(181, 22, 57, 0.18);
        }
        .music-player audio {
            display: block;
            width: 100%;
        }
        .members {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 24px 0;
        }
        .member {
            margin: 0;
            min-width: 0;
            transform: rotate(var(--tilt, 0deg));
            animation: member-arrive 600ms ease both;
            animation-delay: var(--delay, 0ms);
        }
        .member:nth-child(1) { --tilt: -2deg; }
        .member:nth-child(2) { --delay: 70ms; --tilt: 2.5deg; }
        .member:nth-child(3) { --delay: 140ms; --tilt: -1.8deg; }
        .member:nth-child(4) { --delay: 210ms; --tilt: 2.2deg; }
        .member img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 18% 12% 18% 14% / 14% 16% 18% 16%;
            border: 1px solid rgba(195, 72, 98, 0.75);
            filter: sepia(0.25) saturate(1.08) contrast(1.06) hue-rotate(-8deg) brightness(1.03);
            transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
            box-shadow: 0 8px 20px rgba(181, 22, 57, 0.18);
        }
        .member img:hover {
            transform: translateY(-4px) scale(1.03) rotate(0deg);
            box-shadow: 0 10px 24px rgba(181, 22, 57, 0.28);
            filter: sepia(0.2) saturate(1.12) contrast(1.08) hue-rotate(-8deg) brightness(1.06);
        }
        .member figcaption { padding-top: 6px; }
        .member strong { display: block; color: #fff; font-size: 13px; }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--base-red-soft);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4d1220;
            background: #120d0d;
            color: #fff;
            box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: 2px solid var(--base-red);
            outline-offset: 2px;
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #c51843, #8b102d);
            color: #fff;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(181, 22, 57, 0.32); }
        .image-links {
            margin-top: 18px;
            font-size: 13px;
        }
        .image-links a { color: var(--base-red-soft); margin: 0 5px; }
        .image-links a:hover { color: #fff; }
        @keyframes card-arrive {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes member-arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes star-drift {
            from { transform: translateY(0); }
            to { transform: translateY(-60px); }
        }
        @keyframes star-twinkle {
            from { opacity: 0.45; }
            to { opacity: 0.85; }
        }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .container { padding: 22px 18px; }
            .members { gap: 9px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>A Maria faz 12 anos!</h2>
    <p>Vamos cantar os Parabéns em minha casa e depois seguimos para o JumpYard. Temos transporte!<br><br>JumpYard Matosinhos | 10 de outubro<br>Confirma a tua presença através deste formulário.</p>

    <div class="members" aria-label="Fotografias">
        <figure class="member">
            <img src="https://inluxc.github.io/maria/invite-photo-1.jpeg" alt="Fotografia 1" loading="lazy">
        </figure>
        <figure class="member">
            <img src="https://inluxc.github.io/maria/invite-photo-2.jpeg" alt="Fotografia 2" loading="lazy">
        </figure>
        <figure class="member">
            <img src="https://inluxc.github.io/maria/invite-photo-3.jpeg" alt="Fotografia 3" loading="lazy">
        </figure>
        <figure class="member">
            <img src="https://inluxc.github.io/maria/invite-photo-5.jpeg" alt="Fotografia 4" loading="lazy">
        </figure>
    </div>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSdk4LjAL3VTDg43X41S4pOHF3D6dWCNMJbuxCaaB999My5ISw/formResponse" method="POST" accept-charset="UTF-8">
        <div class="form-group">
            <label for="name">Nome completo:</label>
            <input type="text" id="name" name="entry.1663643895" required placeholder="Escreve o teu nome">
        </div>

        <div class="form-group">
            <label for="attendance">Vais juntar-te ao grupo?</label>
            <select id="attendance" name="entry.95264859" required>
                <option value="">Escolhe uma opção</option>
                <option value="Yes">Sim, vou saltar!</option>
                <option value="No">Não vou conseguir ir</option>
            </select>
        </div>

        <button type="submit">Enviar resposta</button>
    </form>
</div>

</body>
</html>
