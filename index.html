<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12.º Aniversário da Maria - Confirmação de presença</title>
    <style>
        body {
            background: radial-gradient(ellipse at top, #312044 0%, #120f1a 58%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            isolation: isolate;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 18px 24px, rgba(255, 231, 170, 0.85) 0 1px, transparent 1.8px),
                radial-gradient(circle at 82px 115px, rgba(174, 242, 255, 0.7) 0 1px, transparent 1.8px),
                radial-gradient(circle at 154px 62px, rgba(255, 179, 255, 0.65) 0 1px, transparent 1.8px),
                radial-gradient(circle at 208px 176px, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.8px);
            background-size: 240px 220px, 310px 280px, 370px 330px, 280px 240px;
            opacity: 0.7;
            animation: star-drift 8s ease-in-out infinite alternate, star-twinkle 4s ease-in-out infinite alternate;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: linear-gradient(135deg, #2b1b3d, #1a1528);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.3);
            border: 2px solid #ff77ff;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            animation: card-arrive 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
        }
        h2 { color: #ff77ff; margin-bottom: 10px; }
        p { color: #d1c4e9; font-size: 14px; margin-bottom: 20px; }
        .music-player {
            width: min(100%, 300px);
            margin: 22px auto;
            overflow: hidden;
            border: 1px solid rgba(255, 179, 255, 0.55);
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(255, 119, 255, 0.18);
        }
        .music-player audio {
            display: block;
            width: 100%;
        }
        .members {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 24px 0;
        }
        .member {
            margin: 0;
            min-width: 0;
            animation: member-arrive 600ms ease both;
            animation-delay: var(--delay, 0ms);
        }
        .member:nth-child(2) { --delay: 70ms; }
        .member:nth-child(3) { --delay: 140ms; }
        .member:nth-child(4) { --delay: 210ms; }
        .member img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 179, 255, 0.65);
            transition: transform 220ms ease, box-shadow 220ms ease;
        }
        .member img:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 18px rgba(255, 119, 255, 0.3);
        }
        .member figcaption { padding-top: 6px; }
        .member strong { display: block; color: #fff; font-size: 13px; }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ffb3ff;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a3b6c;
            background: #120f1a;
            color: #fff;
            box-sizing: border-box;
            font: inherit;
        }
        input:focus, select:focus {
            outline: 2px solid #ff77ff;
            outline-offset: 2px;
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff77ff, #b577ff);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255, 119, 255, 0.3); }
        @keyframes card-arrive {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes member-arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes star-drift {
            from { transform: translateY(0); }
            to { transform: translateY(-60px); }
        }
        @keyframes star-twinkle {
            from { opacity: 0.45; }
            to { opacity: 0.85; }
        }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .container { padding: 22px 18px; }
            .members { gap: 9px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ A Maria faz 12 anos! ✨</h2>
    <p>Vamos cantar os Parabéns em minha casa e depois seguimos para o JumpYard. Temos transporte!<br><br>JumpYard Matosinhos | 10 de outubro<br>Confirma a tua presença através deste formulário.</p>

    <div class="music-player">
        <audio controls preload="none" aria-label="Ouvir PINKY UP das KATSEYE">
            <source src="./pinkyup.mp3" type="audio/mpeg">
            O teu navegador não suporta áudio HTML5.
        </audio>
    </div>

    <div class="members" aria-label="Fotografias">
        <figure class="member">
            <img src="./invite-photo-1.jpeg" alt="Fotografia 1" loading="lazy">
        </figure>
        <figure class="member">
            <img src="./invite-photo-2.jpeg" alt="Fotografia 2" loading="lazy">
        </figure>
        <figure class="member">
            <img src="./invite-photo-3.jpeg" alt="Fotografia 3" loading="lazy">
        </figure>
        <figure class="member">
            <img src="./invite-photo-4.jpeg" alt="Fotografia 4" loading="lazy">
        </figure>
    </div>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSdk4LjAL3VTDg43X41S4pOHF3D6dWCNMJbuxCaaB999My5ISw/formResponse" method="POST" accept-charset="UTF-8">
        <div class="form-group">
            <label for="name">Nome completo:</label>
            <input type="text" id="name" name="entry.1663643895" required placeholder="Escreve o teu nome">
        </div>

        <div class="form-group">
            <label for="attendance">Vais juntar-te ao grupo?</label>
            <select id="attendance" name="entry.95264859" required>
                <option value="">Escolhe uma opção</option>
                <option value="Yes">Sim, vou saltar!</option>
                <option value="No">Não vou conseguir ir</option>
            </select>
        </div>

        <button type="submit">Enviar resposta</button>
    </form>

</div>

</body>
</html>
